---
- name: Mot de passe sudo
  hosts: local
  gather_facts: false

  vars_prompt:
    - name: become_password
      prompt: "Mot de passe sudo"
      private: true
      unsafe: true

  tasks:
    - name: Conserver le mot de passe sudo pour la suite
      set_fact:
        become_password: "{{ become_password }}"
      no_log: true

    - name: Valider le mot de passe sudo
      command: sudo -S -k -p '' true
      args:
        stdin: "{{ become_password }}"
      register: sudo_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Arreter si le mot de passe est incorrect
      fail:
        msg: "Mot de passe sudo incorrect, relance le playbook."
      when: sudo_check.rc != 0

- name: Setup système
  hosts: local
  become: false

  vars_prompt:
    - name: user_name
      prompt: "Nom d'utilisateur"
      private: false

    - name: install_sys
      prompt: "Installer system configuration ? [yes/no]"
      default: "no"
      private: false

    - name: install_utils
      prompt: "Installer les outils (git, rsync, zip, htop, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_apps
      prompt: "Installer les applications (Firefox, Discord, Obsidian, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_dev
      prompt: "Installer l'environnement dev (neovim, plugins, parsers) ? [yes/no]"
      default: "no"
      private: false

    - name: install_games
      prompt: "Installer les packages gaming (Steam, Lutris, Wine, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_creative
      prompt: "Installer les outils créatifs (Blender, Krita) ? [yes/no]"
      default: "no"
      private: false

  vars:
    ansible_become_password: "{{ become_password }}"

  tasks:
    - name: Provisioning
      block:
        - name: Detecter un GPU nvidia
          shell: grep -qx 0x10de /sys/bus/pci/devices/*/vendor
          register: nvidia_probe
          changed_when: false
          failed_when: false

        - name: Exposer has_nvidia
          set_fact:
            has_nvidia: "{{ nvidia_probe.rc == 0 }}"

        - name: Demander sway
          pause:
            prompt: "Installer sway ? [yes/no]"
          register: sway_prompt
          when: install_sys | lower != 'yes'

        - name: Determiner l'installation de sway
          set_fact:
            install_sway: "{{ 'yes' if install_sys | lower == 'yes' else (sway_prompt.user_input | default('no', true)) }}"

        - include_role:
            name: sudo_askpass

        - include_role:
            name: yay

        - include_role:
            name: packages

        - include_role:
            name: sys
          when: install_sys | lower == 'yes'

        - include_role:
            name: utils
          when: install_utils | lower == 'yes'

        - include_role:
            name: apps
          when: install_apps | lower == 'yes'

        - include_role:
            name: sway
          when: install_sway | lower == 'yes'

        - include_role:
            name: dev
          when: install_dev | lower == 'yes'

        - include_role:
            name: games
          when: install_games | lower == 'yes'

        - include_role:
            name: creative
          when: install_creative | lower == 'yes'

        - include_role:
            name: zsh

        # - include_role:
        #     name: settings
        #   when: install_sway | lower == 'yes'

        - include_role:
            name: services

        - include_role:
            name: neovim
          when: install_dev | lower == 'yes'

      always:
        - include_role:
            name: sudo_askpass
            tasks_from: cleanup
