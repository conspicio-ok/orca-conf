---
- name: Setup système
  hosts: local
  become: false

  vars_prompt:
    - name: become_password
      prompt: "Mot de passe sudo"
      private: true
      unsafe: true

    - name: user_name
      prompt: "Nom d'utilisateur"
      private: false

    - name: install_sys
      prompt: "Installer system configuration ? [yes/no]"
      default: "no"
      private: false

    - name: install_utils
      prompt: "Installer les outils (git, rsync, zip, htop, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_apps
      prompt: "Installer les applications (Firefox, Discord, Obsidian, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_host
      prompt: "Installer les paquets spécifiques à la machine (host_vars) ? [yes/no]"
      default: "no"
      private: false

    - name: install_sway
      prompt: "Installer sway ? [yes/no]"
      default: "no"
      private: false

    - name: install_dev
      prompt: "Installer l'environnement dev (neovim, plugins, parsers) ? [yes/no]"
      default: "no"
      private: false

    - name: install_games
      prompt: "Installer les packages gaming (Steam, Lutris, Wine, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_creative
      prompt: "Installer les outils créatifs (Blender, Krita) ? [yes/no]"
      default: "no"
      private: false

  vars:
    ansible_become_password: "{{ become_password }}"

  tasks:
    - name: Provisioning
      block:
        - name: Detecter un GPU nvidia
          shell: grep -qx 0x10de /sys/bus/pci/devices/*/vendor
          register: nvidia_probe
          changed_when: false
          failed_when: false

        - name: Exposer has_nvidia
          set_fact:
            has_nvidia: "{{ nvidia_probe.rc == 0 }}"

        - include_role:
            name: sudo_askpass

        - include_role:
            name: yay

        - include_role:
            name: packages

        - include_role:
            name: host
          when: install_host | lower == 'yes'

        - include_role:
            name: sys
          when: install_sys | lower == 'yes'

        - include_role:
            name: utils
          when: install_utils | lower == 'yes'

        - include_role:
            name: apps
          when: install_apps | lower == 'yes'

        - include_role:
            name: sway
          when: install_sway | lower == 'yes'

        - include_role:
            name: dev
          when: install_dev | lower == 'yes'

        - include_role:
            name: games
          when: install_games | lower == 'yes'

        - include_role:
            name: creative
          when: install_creative | lower == 'yes'

        - include_role:
            name: zsh

        # - include_role:
        #     name: settings
        #   when: install_sway | lower == 'yes'

        - include_role:
            name: services

        - include_role:
            name: neovim
          when: install_dev | lower == 'yes'

      always:
        - include_role:
            name: sudo_askpass
            tasks_from: cleanup
