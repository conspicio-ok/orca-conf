---
- name: Installer les packages pacman utils
  become: true
  pacman:
    name: "{{ pacman_packages_utils }}"
    state: present

- name: Installer les packages AUR utils
  include_role:
    name: packages
    tasks_from: aur
  vars:
    aur_list: "{{ aur_packages_utils }}"
    aur_label: "utils"

- name: Ajouter l'utilisateur aux groupes utiles
  become: true
  user:
    name: "{{ user_name }}"
    groups: "{{ user_groups_utils }}"
    append: true
