---
- name: Installer les packages dev pacman
  become: true
  pacman:
    name: "{{ pacman_packages_dev }}"
    state: present

- name: Installer les packages dev AUR
  include_role:
    name: packages
    tasks_from: aur
  vars:
    aur_list: "{{ aur_packages_dev }}"
    aur_label: "dev"

- name: Ajouter l'utilisateur aux groupes utiles
  become: true
  user:
    name: "{{ user_name }}"
    groups: "{{ user_groups_dev }}"
    append: true
