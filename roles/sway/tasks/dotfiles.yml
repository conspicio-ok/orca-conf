---
- name: Liste des dotfiles déployés depuis ce repo
  set_fact:
    ansible_dotfiles:
      - waybar
      - sway
      - foot
      - wlogout
      - gtklock
      - theme

- name: Stat des cibles dans ~/.config
  stat:
    path: "{{ user_home }}/.config/{{ item }}"
  loop: "{{ ansible_dotfiles }}"
  register: dotfiles_targets

- name: Créer l'arborescence de sauvegarde dans ~/.config.bak
  file:
    path: "{{ user_home }}/.config.bak/{{ item.item | dirname }}"
    state: directory
    mode: '0755'
  loop: "{{ dotfiles_targets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Sauvegarder la config existante dans ~/.config.bak
  command: mv "{{ user_home }}/.config/{{ item.item }}" "{{ user_home }}/.config.bak/{{ item.item }}"
  args:
    creates: "{{ user_home }}/.config.bak/{{ item.item }}"
  loop: "{{ dotfiles_targets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - not item.stat.islnk

- name: Déployer les dotfiles depuis ce repo
  file:
    src: "{{ playbook_dir }}/dotfiles/{{ item }}"
    dest: "{{ user_home }}/.config/{{ item }}"
    state: link
    force: true
  loop: "{{ ansible_dotfiles }}"

- name: Créer le dossier kanshi s'il est absent
  file:
    path: "{{ user_home }}/.config/kanshi"
    state: directory
    mode: '0755'

- name: Lier le dossier kanshi/orca-conf du repo
  file:
    src: "{{ playbook_dir }}/dotfiles/kanshi/orca-conf"
    dest: "{{ user_home }}/.config/kanshi/orca-conf"
    state: link
    force: true

- name: Initialiser la config kanshi si absente
  copy:
    src: "{{ playbook_dir }}/dotfiles/kanshi/default"
    dest: "{{ user_home }}/.config/kanshi/config"
    mode: '0644'
    force: false

- name: Initialiser les includes kanshi s'ils sont absents
  copy:
    content: ""
    dest: "{{ user_home }}/.config/kanshi/{{ item }}"
    mode: '0644'
    force: false
  loop:
    - outputs
    - personal
  register: kanshi_includes

- name: Signaler les includes kanshi à renseigner
  debug:
    msg:
      - "kanshi : ~/.config/kanshi/outputs et ~/.config/kanshi/personal ont été initialisés vides, ils ne sont jamais modifiés par ansible."
      - "outputs : y déclarer les écrans de cette machine (output \"<nom>\" { mode, position, scale, alias $NOM })."
      - "personal : y déclarer les profils (profile <nom> { output $NOM enable }) et leurs exec."
      - "config : créé s'il est absent, il importe outputs, personal et orca-conf/ (symlink vers le repo, profil defaut). kanshi-gtk4 écrit dans config."
  when: kanshi_includes.results | selectattr('changed') | list | length > 0

- name: Créer le dossier config.d de sway
  file:
    path: "{{ playbook_dir }}/dotfiles/sway/config.d"
    state: directory
    mode: '0755'

- name: Générer le fragment sway machine-local
  template:
    src: sway-local.j2
    dest: "{{ playbook_dir }}/dotfiles/sway/config.d/local"
    mode: '0644'

- name: Créer le dossier des scripts consommés par waybar
  file:
    path: "{{ user_home }}/.config/dotfiles/scripts"
    state: directory
    mode: '0755'

- name: Déployer le script de comptage des mises à jour
  file:
    src: "{{ playbook_dir }}/dotfiles/scripts/count_updates.sh"
    dest: "{{ user_home }}/.config/dotfiles/scripts/count_updates.sh"
    state: link
    force: true

- name: Déployer le script d'allocation des workspaces
  file:
    src: "{{ playbook_dir }}/dotfiles/scripts/assign-workspaces.sh"
    dest: "{{ user_home }}/.config/dotfiles/scripts/assign-workspaces.sh"
    state: link
    force: true

- name: Déployer le lanceur de session sway
  file:
    src: "{{ playbook_dir }}/dotfiles/sway/start-sway"
    dest: "{{ user_home }}/.local/bin/start-sway"
    state: link
    force: true
  when: has_nvidia

- name: Deployer la session ly sway-conspicio
  file:
    src: "{{ playbook_dir }}/dotfiles/sway/sway-conspicio.desktop"
    dest: /etc/ly/custom-sessions/sway-conspicio.desktop
    state: link
    force: true
  become: true
  when: has_nvidia

